<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>HBE Assistant — Settings</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1b1f27;
    }

    h1 {
      font-size: 18px;
    }

    p {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      box-sizing: border-box;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      box-sizing: border-box;
      margin: 10px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    button {
      padding: 8px 16px;
      background: #3b5bdb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #status {
      margin-left: 10px;
      font-size: 13px;
      color: green;
    }

    a {
      color: #3b5bdb;
    }
  </style>
</head>

<body>
  <h1>HBE Assistant — Settings</h1>
  <p>
    This extension uses your own Gemini API key so requests are billed to
    you. Get a free key at
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">
      aistudio.google.com/apikey
    </a>.
  </p>
  <input type="text" id="apiKey" placeholder="Paste your Gemini API key here" />
  <label for="model">Answer model</label>
  <select id="model">
    <option value="gemini-3.5-flash-lite">Fast: gemini-3.5-flash-lite</option>
    <option value="gemini-3.6-flash">Accurate: gemini-3.6-flash</option>
  </select>
  <div>
    <button id="save">Save</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>

</html>
